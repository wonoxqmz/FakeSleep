[hotkey]
; 黑屏模式热键（F11 手机远控软键盘上没有，改用 F2）。key 可用：F1-F24 / ESC / SPACE / A-Z / 0-9 / PAUSE / SCROLLLOCK / INSERT / HOME / END
key = F2
ctrl = no
alt = no
shift = no

[privacy]
; 隐私模式热键（本机屏幕变黑，但远程控制软件照常看到完整实时画面）
; F1 在键盘最左上角，摸黑也好按；若被占用会自动降级到 Ctrl+Alt+F1
key = F1
ctrl = no
alt = no
shift = no
; 隐私模式怎么做：
;   veil = 纯黑遮罩 + 从屏幕捕获里排除（本机像素级全黑，远控照常看到桌面）—— 推荐
;   ddc  = DDC/CI 硬件调光（部分显示器不认，屏幕还是亮的）
;   both = 两个都上
method = veil
; 下面是 ddc / both 生效时的值
; 隐私模式时屏幕上那个退出的按钮：
;   corner = 右上角半透明小「恢复 ×」（默认）
;   bar    = 屏幕下方的大绿条（老样式）
;   off    = 不显示（只能靠 F1 / Esc 退出；手机远控会出不来，慎用）
exit_button = corner
; 按下隐私模式时把亮度调到多少（0 = 最暗）。有的显示器 0 仍有背光，可试 0/5/10
dim_value = 0
; 对比度也一起归零，屏幕会更黑（大多数显示器推荐 0）；-1 = 不动对比度
dim_contrast = 0

[display]
; yes = 黑屏时强行不让显示器熄灯（客厅看着像关机但一直是亮的）
; no  = 允许显示器自动熄灯，更省电，也睡得更像
keep_display_on = yes

[update]
; yes = 启动后静默查一次 GitHub 最新版本（只查一次，失败就当没发生，不弹窗不下载）
; no  = 完全不联网；面板左下角的「检查更新」仍然可以手动点
check_on_start = yes
